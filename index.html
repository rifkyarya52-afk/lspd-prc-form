<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSPD - Patrol Rifle Certification (PRC) Application</title>
  <!-- Library untuk mengubah form menjadi gambar PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
    }
    body {
      background-color: #1e2229;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .paper {
      background: #ffffff;
      width: 100%;
      max-width: 820px;
      padding: 40px 45px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border-top: 8px solid #0b2239;
      color: #111;
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #111;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .lspd-logo {
      width: 75px;
      height: auto;
      margin-bottom: 8px;
    }
    .header h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      letter-spacing: 1.5px;
      margin: 0;
      color: #0b2239;
    }
    .header h2 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      margin: 4px 0 2px;
      color: #333;
    }
    .header p {
      font-size: 11px;
      margin: 0;
      color: #666;
    }
    .section-title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: bold;
      background-color: #0b2239;
      color: #fff;
      padding: 5px 10px;
      letter-spacing: 1px;
      margin-top: 22px;
      margin-bottom: 12px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      color: #222;
      margin-bottom: 4px;
    }
    .field input[type="text"],
    .field input[type="date"],
    .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid #444;
      background: #f9fafb;
      padding: 6px 8px;
      font-size: 13px;
      color: #000;
      outline: none;
    }
    .field textarea {
      border: 1px solid #888;
      resize: vertical;
      min-height: 75px;
    }
    .checklist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .checklist-table th {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      text-align: left;
      border-bottom: 1.5px solid #111;
      padding: 6px 4px;
    }
    .checklist-table td {
      padding: 8px 4px;
      border-bottom: 1px solid #ddd;
    }
    .checklist-table td.center,
    .checklist-table th.center {
      text-align: center;
      width: 70px;
    }
    input[type="radio"],
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .agreement-box {
      background: #f4f6f8;
      border-left: 4px solid #0b2239;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }
    .actions-bar {
      width: 100%;
      max-width: 820px;
      background: #282d37;
      padding: 16px 20px;
      margin-top: 15px;
      border-radius: 6px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: bold;
      padding: 11px 18px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.2s;
    }
    .btn-img {
      background-color: #16a34a;
      color: #fff;
    }
    .btn-img:hover {
      background-color: #15803d;
    }
    .btn-copy {
      background-color: #0b2239;
      color: #fff;
      border: 1px solid #3b5998;
    }
    .btn-copy:hover {
      background-color: #163a5f;
    }
    .btn-print {
      background-color: #4b5563;
      color: #fff;
    }
    .btn-print:hover {
      background-color: #374151;
    }
    @media (max-width: 600px) {
      .paper { padding: 25px 18px; }
      .grid-2 { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .paper { box-shadow: none; border: none; padding: 10px; }
      .
